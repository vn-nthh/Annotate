[package]
name = "whisper-worker"
version = "0.1.0"
edition = "2021"

[features]
default = ["cuda"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
serde_json = "1.0"
base64 = "0.22.1"
hound = "3.5"
# Backend features are selected via this crate's `cuda` / `vulkan` features.
whisper-rs = { version = "0.16", default-features = false }
