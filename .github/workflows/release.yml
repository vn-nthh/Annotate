name: 'Release Annotate'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure Google OAuth client
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          if (-not $env:GOOGLE_OAUTH_CLIENT_ID) {
            throw 'Repository variable GOOGLE_OAUTH_CLIENT_ID is required for release builds.'
          }
          @{ client_id = $env:GOOGLE_OAUTH_CLIENT_ID } |
            ConvertTo-Json |
            Set-Content -Encoding utf8 src/oauth.config.json

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          winget install --id KhronosGroup.VulkanSDK -e --accept-source-agreements --accept-package-agreements
          $sdkRoot = 'C:\VulkanSDK'
          if (-not (Test-Path $sdkRoot)) {
            throw "Vulkan SDK install path not found: $sdkRoot"
          }
          $latest = Get-ChildItem -Path $sdkRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $latest) {
            throw 'No Vulkan SDK version directory found after install.'
          }
          "VULKAN_SDK=$($latest.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "VULKAN_SDK=$($latest.FullName)"

      - name: Ensure Whisper sidecars
        shell: pwsh
        run: |
          $cudaSidecar = 'src-tauri\binaries\whisper-worker-x86_64-pc-windows-msvc.exe'
          $vulkanSidecar = 'src-tauri\binaries\whisper-worker-vulkan-x86_64-pc-windows-msvc.exe'

          if (Test-Path $cudaSidecar) {
            Write-Host "Using checked-in CUDA Whisper sidecar: $cudaSidecar"
          }

          # Always rebuild via the script when possible. The script keeps an
          # existing CUDA binary if CUDA toolkit is unavailable on the runner.
          ./scripts/build-whisper-worker.ps1

          if (-not (Test-Path $vulkanSidecar)) {
            throw "Vulkan Whisper sidecar missing after build: $vulkanSidecar"
          }
          if (-not (Test-Path $cudaSidecar)) {
            Write-Warning "CUDA Whisper sidecar missing; CUDA local mode will be unavailable in this build."
          }

      - name: Test
        run: |
          npm test
          cargo test --package annotate --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Annotate v__VERSION__'
          releaseBody: |
            ## Annotate v__VERSION__

            Push-to-talk voice transcription for Windows.

            ### Installation
            - **`.msi`** — Windows Installer (recommended)
            - **`.exe`** — NSIS installer

            > ⚠️ Windows SmartScreen may show a warning since the app is not code-signed yet. Click "More info" → "Run anyway" to proceed.
          releaseDraft: true
          prerelease: false
