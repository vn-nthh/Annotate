name: Release Annotate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      WHISPER_WORKER_TARGET_DIR: ${{ runner.temp }}/w
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Configure Google OAuth client
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          if (-not $env:GOOGLE_OAUTH_CLIENT_ID) {
            throw 'Repository variable GOOGLE_OAUTH_CLIENT_ID is required for release builds.'
          }
          $config = @{ client_id = $env:GOOGLE_OAUTH_CLIENT_ID } | ConvertTo-Json
          [IO.File]::WriteAllText('src/oauth.config.json', $config, [Text.UTF8Encoding]::new($false))

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $version = '1.4.350.0'
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          $sdkDir = Join-Path $env:RUNNER_TEMP 'vulkan-sdk'
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile $installer
          if ((Get-AuthenticodeSignature -LiteralPath $installer).Status -ne 'Valid') {
            throw 'Vulkan SDK installer signature is invalid.'
          }
          $process = Start-Process -FilePath $installer -ArgumentList @('--root', "`"$sdkDir`"", '--accept-licenses', '--default-answer', '--confirm-command', 'install') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $sdkDir 'Bin\glslc.exe'))) {
            throw 'Vulkan SDK installation failed.'
          }
          "VULKAN_SDK=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build native app and Vulkan worker
        shell: pwsh
        run: ./scripts/build-native.ps1

      - name: Test native behavior
        run: cargo test --package annotate --locked --manifest-path src-tauri/Cargo.toml

      - name: Package portable native app
        shell: pwsh
        run: ./scripts/package-native.ps1 -SkipBuild

      - name: Check the extracted package
        shell: pwsh
        run: |
          $archive = (Get-ChildItem -LiteralPath dist -Filter '*.zip').FullName
          ./scripts/test-native-package.ps1 -Archive $archive

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: annotate-windows-x64
          path: dist/*.zip

      - name: Create draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archive = (Get-ChildItem -LiteralPath dist -Filter '*.zip').FullName
          gh release create $env:GITHUB_REF_NAME $archive --draft --verify-tag --title "Annotate $env:GITHUB_REF_NAME" --notes 'Extract the Windows x64 ZIP and run annotate.exe. Keep the included DLL and Vulkan worker beside the app.'
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
